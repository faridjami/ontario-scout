<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ontario Crown Land & WMU Finder</title>
    
    <!-- 1. Stable, Unbroken Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body, #map { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #dddddd;
        }
        #search-container {
            position: absolute; 
            top: 10px; 
            left: 50px; 
            z-index: 1000;
            background: white; 
            padding: 10px; 
            border-radius: 5px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="search-container">
        <input type="text" id="wmu-input" placeholder="Enter WMU (e.g., 47)">
        <button onclick="searchWMU()">Filter</button>
    </div>

    <!-- The Map Container -->
    <div id="map"></div>

    <!-- 2. Stable, Unbroken Leaflet Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 3. Your Local Data Arrays (Loaded BEFORE app.js so variables exist) -->
    <script src="wmu.js"></script>
    <script src="crown.js"></script>
    
    <!-- 4. Main App Engine Application Logic -->
    <script src="app.js"></script>

</body>
</html>
